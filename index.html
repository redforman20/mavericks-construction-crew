(()=>{'use strict';const KEY='maverick-construction-v1',morning=[['m1','🪥','Brush teeth'],['m2','👕','Get dressed'],['m3','🍊','Take vitamin'],['m4','💊','Take medicine'],['m5','🐶','Feed the dogs'],['m6','🎒','Shoes, coat, backpack']],bedtime=[['b1','💊','Take medicine'],['b2','🧸','Pick up toys'],['b3','🪥','Brush teeth'],['b4','🛁','Take a bath'],['b5','📖','Pick a book']];const defaults=['Choose a sticker','Pick a family game','Choose a treasure chest prize'];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.records=state.records||{};state.rewards=Array.isArray(state.rewards)?state.rewards:defaults.slice();state.voiceEnabled=state.voiceEnabled!==false;const $=id=>document.getElementById(id);const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=()=>localDate(new Date());const startOfWeek=date=>{const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d};let selected=today(),weekStart=startOfWeek(new Date()),mode='morning',movingTimer=null,finishTimer=null;function dates(){return Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d})}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Unable to save progress on this device.')}}function count(day,list){return list.filter(t=>!!(state.records[day]||{})[t[0]]).length}function total(){return dates().reduce((n,d)=>n+count(localDate(d),morning)+count(localDate(d),bedtime),0)}function list(){return mode==='morning'?morning:bedtime}function positionTruck(progress,instant=false){const rail=$('truckRail'),truck=$('truck');if(instant)truck.style.transition='none';const max=Math.max(0,rail.clientWidth-truck.offsetWidth-4);truck.style.transform=`translateX(${max*progress}px)`;if(instant){void truck.offsetHeight;truck.style.transition=''}}function showBricks(n,animate){const load=$('brickLoad');const previous=load.children.length;if(previous===n)return;load.replaceChildren();const ns='http://www.w3.org/2000/svg';const slots=[[44,109],[87,109],[130,109],[44,85],[87,85],[130,85]];for(let i=0;i<n;i++){const [x,y]=slots[i];if(x===undefined)break;const g=document.createElementNS(ns,'g');if(animate&&i>=previous)g.setAttribute('class','new-brick');const rect=(tag,attrs)=>{const el=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,String(value));g.append(el)};rect('rect',{x,y,width:40,height:22,rx:2,class:'brick brick-body'});rect('path',{d:`M${x} ${y} l7 -6 h40 l-7 6 Z`,class:'brick-top'});rect('path',{d:`M${x+40} ${y} l7 -6 v22 l-7 6 Z`,class:'brick-side'});rect('path',{d:`M${x+5} ${y+7} h28`,stroke:'#ffb890','stroke-width':2,opacity:.75});load.append(g)}}function updateScene(countNow,max,instant){$('scene').classList.toggle('night',mode==='bedtime');$('sky').textContent=mode==='morning'?'☀️':'🌙';$('headline').textContent=countNow===max?'ALL JOBS DONE! ⭐':`${max-countNow} MORE ${max-countNow===1?'JOB':'JOBS'} TO GO!`;$('progressText').textContent=`${countNow} OF ${max} JOBS FINISHED • 🧱 ${countNow} ${countNow===1?'BRICK':'BRICKS'} LOADED`;$('progressFill').style.width=(countNow/max*100)+'%';showBricks(countNow,!instant);positionTruck(countNow/max,instant)}function updateCards(){const el=$('cards');el.replaceChildren();for(const [id,emoji,label] of list()){const done=!!(state.records[selected]||{})[id];const card=document.createElement('button');card.type='button';card.className='task'+(done?' done':'');card.setAttribute('aria-pressed',String(done));const sp=document.createElement('span');sp.className='speaker';sp.textContent='🔊';sp.setAttribute('aria-hidden','true');const ico=document.createElement('span');ico.className='emoji';ico.textContent=emoji;const name=document.createElement('span');name.className='name';name.textContent=label;const chk=document.createElement('span');chk.className='check';chk.textContent='✓';card.append(sp,ico,name,chk);card.onclick=()=>finishTask(id);el.append(card)}}function updateWeek(){const ds=dates();$('days').replaceChildren();for(const d of ds){const k=localDate(d),n=count(k,morning)+count(k,bedtime);const el=document.createElement('button');el.className='day'+(selected===k?' active':'');el.textContent=d.toLocaleDateString('en-US',{weekday:'short'});const num=document.createElement('em');num.textContent=n===11?'⭐':n+'/11';el.append(num);el.onclick=()=>{selected=k;render(true)};$('days').append(el)}$('weekRange').textContent=ds[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})+'–'+ds[6].toLocaleDateString('en-US',{month:'short',day:'numeric'});const score=total();$('total').textContent=score+' / 77';$('rewards').replaceChildren();[20,40,60].forEach((threshold,i)=>{const row=document.createElement('div');row.className='reward'+(score>=threshold?' unlocked':'');const icon=document.createElement('span');icon.className='reward-icon';icon.textContent=score>=threshold?['⭐','🎲','🏆'][i]:'🔒';const col=document.createElement('div');const title=document.createElement('strong');title.textContent=threshold+' stars '+(score>=threshold?'— UNLOCKED!':'— '+Math.max(0,threshold-score)+' to go');const desc=document.createElement('span');desc.textContent=state.rewards[i];col.append(title,desc);row.append(icon,col);$('rewards').append(row)})}function render(instant=true){clearTimeout(movingTimer);clearTimeout(finishTimer);$('truck').classList.remove('moving');$('puff').classList.remove('go');$('spark').classList.remove('go');$('complete').classList.remove('show');$('tabMorning').classList.toggle('active',mode==='morning');$('tabBedtime').classList.toggle('active',mode==='bedtime');const now=count(selected,list());updateScene(now,list().length,instant);updateCards();updateWeek()}function finishTask(id){state.records[selected]??={};const was=!!state.records[selected][id];state.records[selected][id]=!was;save();const now=count(selected,list()),max=list().length;updateCards();updateWeek();$('complete').classList.remove('show');updateScene(now,max,false);if(was){clearTimeout(finishTimer);clearTimeout(movingTimer);$('truck').classList.remove('moving');return}const truck=$('truck');truck.classList.add('moving');$('puff').classList.remove('go');$('spark').classList.remove('go');void $('spark').offsetWidth;$('puff').classList.add('go');$('spark').classList.add('go');sound();speakPraise();clearTimeout(movingTimer);movingTimer=setTimeout(()=>{truck.classList.remove('moving')},1250);if(now===max){finishTimer=setTimeout(()=>{if(count(selected,list())!==list().length)return;$('complete').classList.add('show');confetti()},1330)}}const phrases=['Way to go, Maverick!','Awesome job, Maverick!','Great building, Maverick!','You did it, Maverick!','High five, Maverick!'];let phraseIndex=0;function speakPraise(){if(!state.voiceEnabled||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(phrases[phraseIndex++%phrases.length]);u.lang='en-US';u.rate=.90;u.pitch=1.08;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('en-us')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.speak(u)}catch{}}function sound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(530,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(850,ctx.currentTime+.17);g.gain.setValueAtTime(.09,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.24);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.24);o.onended=()=>ctx.close()}catch{}}function confetti(){const colors=['#ffd12b','#ec683e','#3895cc','#53ac5b'];for(let i=0;i<44;i++){const el=document.createElement('div');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.background=colors[i%4];el.style.animationDelay=Math.random()*.35+'s';document.body.append(el);setTimeout(()=>el.remove(),2500)}setTimeout(()=>$('complete').classList.remove('show'),3300)}function settings(){const overlay=document.createElement('div');overlay.className='overlay';const modal=document.createElement('div');modal.className='modal';modal.innerHTML='<h2>⚙️ Parent Settings</h2><p>Stars are stored on this device. Medicine and vitamins are always supervised by an adult.</p>';[20,40,60].forEach((goal,i)=>{const label=document.createElement('label');label.textContent=goal+' star reward';const input=document.createElement('input');input.type='text';input.value=state.rewards[i];input.id='reward'+i;modal.append(label,input)});const toggle=document.createElement('label');toggle.className='toggle';toggle.textContent='🔊 Voice encouragement';const check=document.createElement('input');check.type='checkbox';check.checked=state.voiceEnabled;toggle.prepend(check);modal.append(toggle);const actions=document.createElement('div');actions.className='actions';function button(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;actions.append(b)}button('▶ Test voice',()=>{const old=state.voiceEnabled;state.voiceEnabled=true;speakPraise();state.voiceEnabled=old},'secondary');button('Save',()=>{state.rewards=[0,1,2].map(i=>($('reward'+i).value.trim()||defaults[i]).slice(0,120));state.voiceEnabled=check.checked;save();overlay.remove();render(true)});button('Close',()=>overlay.remove(),'secondary');button('Reset week',()=>{if(!confirm('Erase all stars this week?'))return;for(const d of dates())delete state.records[localDate(d)];save();overlay.remove();render(true)},'danger');modal.append(actions);overlay.append(modal);overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};$('modalRoot').append(overlay)}$('tabMorning').onclick=()=>{mode='morning';render(true)};$('tabBedtime').onclick=()=>{mode='bedtime';render(true)};$('today').onclick=()=>{selected=today();weekStart=startOfWeek(new Date());render(true)};$('settings').onclick=settings;window.addEventListener('resize',()=>positionTruck(count(selected,list())/list().length,true));render(true);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
